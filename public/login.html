<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samaipata - Sign In</title>
  <link rel="icon" type="image/svg+xml" href="Icon.ico" />
  <link rel="alternate icon" href="Icon.ico" />

  <script>
    (function() {
      try {
        var saved = localStorage.getItem('samaipata_theme');
        if (saved === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <!-- Header Branding -->
  <header class="auth-header">
    <a href="index.html" class="brand-link">
      <i class="fa-solid fa-archway"></i>
      <span>samaipata</span>
    </a>

    <div class="flex items-center gap-2">
      <button id="btn-theme-toggle" class="icon-btn" title="Toggle theme (Light / Dark)">
        <i data-lucide="sun-moon" style="width: 16px; height: 16px;"></i>
      </button>
    </div>
  </header>

  <!-- Centered Login / Register Card -->
  <main class="auth-main">
    <div class="auth-hero">
      <div class="auth-logo-box">
        <i class="fa-solid fa-archway"></i>
      </div>
      <h1 class="auth-title">
        Welcome to Samaipata
      </h1>
      <p class="auth-subtitle">
        Local & Cloud AI Inference Workspace
      </p>
    </div>

    <!-- Card Container -->
    <div class="auth-card">
      
      <!-- Segmented Tabs Switcher -->
      <div class="tab-bar-container">
        <button id="tab-login" type="button" class="tab-item tab-item-active">
          Sign In
        </button>
        <button id="tab-register" type="button" class="tab-item">
          Create Account
        </button>
      </div>

      <!-- Alert Box -->
      <div id="auth-alert" class="hidden" style="padding: 10px; margin-bottom: 16px; border-radius: 8px; font-size: 0.8rem; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171;"></div>

      <!-- Form Login -->
      <form id="form-login">
        <div class="form-group">
          <label class="auth-label" for="login-username">Username or Email</label>
          <input
            id="login-username"
            type="text"
            required
            autocomplete="username"
            placeholder="e.g. franco"
            class="auth-input"
          />
        </div>

        <div class="form-group">
          <label class="auth-label" for="login-password">Password</label>
          <input
            id="login-password"
            type="password"
            required
            autocomplete="current-password"
            placeholder="••••••••"
            class="auth-input"
          />
        </div>

        <button
          id="btn-login-submit"
          type="submit"
          class="auth-btn-primary"
        >
          <span>Sign In</span>
          <i data-lucide="arrow-right" style="width: 14px; height: 14px;"></i>
        </button>
      </form>

      <!-- Form Register -->
      <form id="form-register" class="hidden">
        <div class="form-group">
          <label class="auth-label" for="reg-username">Username</label>
          <input
            id="reg-username"
            type="text"
            required
            autocomplete="username"
            placeholder="e.g. franco"
            class="auth-input"
          />
        </div>

        <div class="form-group">
          <label class="auth-label" for="reg-email">Email Address</label>
          <input
            id="reg-email"
            type="email"
            required
            autocomplete="email"
            placeholder="franco@example.com"
            class="auth-input"
          />
        </div>

        <div class="form-group">
          <label class="auth-label" for="reg-password">Password</label>
          <input
            id="reg-password"
            type="password"
            required
            autocomplete="new-password"
            placeholder="Minimum 6 characters"
            class="auth-input"
          />
        </div>

        <button
          id="btn-register-submit"
          type="submit"
          class="auth-btn-primary"
        >
          <span>Create Free Account</span>
          <i data-lucide="user-plus" style="width: 14px; height: 14px;"></i>
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="auth-footer">
    <p>Samaipata • 100% Free and Open</p>
  </footer>

  <script src="js/login.js"></script>
</body>
</html>
