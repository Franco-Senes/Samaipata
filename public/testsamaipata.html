<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Samaipata — Evaluation & Test Portal</title>
  <link rel="icon" type="image/svg+xml" href="Icon.ico" />
  <link rel="alternate icon" href="Icon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .portal-container {
      max-width: 860px;
      width: 100%;
      margin: auto;
      text-align: center;
    }

    .portal-logo {
      width: 56px;
      height: 56px;
      background-color: #222222;
      border: 1px solid #2c2c2c;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      color: #ffffff;
      font-size: 24px;
    }

    .portal-logo i {
      color: #ffffff !important;
    }

    .portal-title {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: 2.2rem;
      font-weight: 400;
      color: #ffffff !important;
      margin-bottom: 36px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      text-align: left;
    }

    @media (max-width: 700px) {
      .cards-grid {
        grid-template-columns: 1fr;
      }
    }

    .option-card {
      background-color: #1c1c1c;
      border: 1px solid #2c2c2c;
      border-radius: 20px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 28px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .option-card:hover {
      transform: translateY(-3px);
      border-color: #444444;
    }

    .card-title {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: #ffffff !important;
    }

    .card-note {
      font-size: 0.88rem;
      color: #9ca3af !important;
      line-height: 1.5;
    }

    .btn-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 18px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 0.15s ease, border-color 0.15s ease;
      cursor: pointer;
      width: 100%;
    }

    .btn-white {
      background-color: #ffffff;
      color: #121212 !important;
    }

    .btn-white:hover {
      background-color: #e5e5e5;
    }

    .btn-dark {
      background-color: #242424;
      color: #ffffff !important;
      border: 1px solid #363636;
    }

    .btn-dark:hover {
      background-color: #2c2c2c;
      border-color: #666666;
    }
  </style>
</head>
<body>

  <main class="portal-container">
    
    <div class="portal-logo">
      <i class="fa-solid fa-archway"></i>
    </div>

    <h1 class="portal-title">
      How would you like to experience Samaipata?
    </h1>

    <div class="cards-grid">
      
      <div class="option-card">
        <div>
          <h2 class="card-title">Web Version</h2>
          <p class="card-note">
            Note: Local offline Ollama models are disabled in web mode.
          </p>
        </div>

        <div class="btn-list">
          <a href="/" class="btn btn-white">
            <span>Launch Web Version</span>
            <i class="fa-solid fa-arrow-right"></i>
          </a>
        </div>
      </div>

      <div class="option-card">
        <div>
          <h2 class="card-title">Local Desktop Version</h2>
          <p class="card-note">
            Note: Supports full offline Ollama models and local marketplace.
          </p>
        </div>

        <div class="btn-list">
          <a href="https://github.com/Franco-Senes/Samaipata/releases/tag/%23Samaipata" target="_blank" rel="noopener noreferrer" class="btn btn-dark">
            <i class="fa-solid fa-download"></i>
            <span>Download Release</span>
          </a>
          <a href="https://github.com/Franco-Senes/Samaipata" target="_blank" rel="noopener noreferrer" class="btn btn-dark">
            <i class="fa-brands fa-github"></i>
            <span>GitHub Repository</span>
          </a>
        </div>
      </div>

    </div>

  </main>

</body>
</html>
